<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kahani">
  <title>Kahani</title>
  <rect width="64" height="64" rx="13" fill="#1F4D2B"/>
  <!-- A stem that forks: one path becomes two. Asymmetric on purpose, so the
       mark does not read as the letter Y. -->
  <g fill="none" stroke="#F5F2EA" stroke-width="6.5" stroke-linecap="round">
    <path d="M31 54 V41"/>
    <path d="M31 41 C31 31, 19 30, 17 21"/>
    <path d="M31 41 C31 33, 43 33, 48 26"/>
  </g>
  <g fill="#7FC98A">
    <circle cx="17" cy="21" r="4.5"/>
    <circle cx="48" cy="26" r="4.5"/>
  </g>
</svg>
