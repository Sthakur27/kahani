<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kahani">
  <rect width="64" height="64" rx="14" fill="#1F4D2B"/>
  <!-- One path that forks twice: the shape of a branching story. -->
