    <path d="M32 52 V38"/>
    <path d="M32 38 C32 30, 20 30, 20 22"/>
    <path d="M32 38 C32 30, 44 30, 44 22"/>
  </g>
  <g fill="#8FD694">
    <circle cx="20" cy="17" r="5"/>
    <circle cx="44" cy="17" r="5"/>
  </g>
</svg>
